<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jornada dos Temperamentos</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

body {
    margin: 0;
    font-family: 'Playfair Display', serif;
    background: radial-gradient(circle at top, #fff0f6, #ffe3ee, #ffd1e3);
    color: #3a2230;
    display: flex;
    justify-content: center;
}

.container {
    width: 100%;
    max-width: 720px;
    padding: 24px;
}

/* CARTÕES GLASS */
.screen {
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(18px);
    border-radius: 28px;
    padding: 28px;
    margin-top: 24px;
    box-shadow: 0 25px 60px rgba(255, 120, 170, 0.18);
    text-align: center;
}

/* TÍTULOS ELEGANTES */
h1, h2 {
    font-family: 'Great Vibes', cursive;
    font-weight: 400;
    font-size: 36px;
    margin-bottom: 10px;
}

p {
    opacity: 0.75;
    line-height: 1.6;
}

/* BOTÃO PRINCIPAL */
.btn-primary {
    width: 100%;
    padding: 16px;
    margin-top: 20px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, #ff7aa2, #ff4f87);
    color: white;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(255, 79, 135, 0.25);
}

/* IMAGEM */
.cover {
    width: 100%;
    height: 260px;
    object-fit: cover;
    border-radius: 24px;
    margin-bottom: 15px;
}

/* FRASE */
.phrase {
    font-style: italic;
    font-size: 18px;
    margin: 10px 0 20px;
}

/* OPÇÕES CIRCULARES */
.options {
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-items: center;
}

.option {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: rgba(255,255,255,0.7);
    border: 1px solid rgba(255, 120, 170, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 11px;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 10px 20px rgba(255, 150, 190, 0.15);
}

.option:hover {
    transform: scale(1.15);
    background: #fff;
    box-shadow: 0 15px 30px rgba(255, 120, 170, 0.25);
}

/* HIDE */
.hidden { display:none; }

</style>
</head>

<body>

<div class="container">

<!-- CAPA -->
<div id="start" class="screen">

    <h1>Jornada dos Temperamentos</h1>
    <p>Uma experiência de autoconhecimento profundo.</p>

    <button class="btn-primary" onclick="start()">Iniciar Jornada</button>

</div>

<!-- ESTAÇÃO -->
<div id="station" class="screen hidden">

    <img id="img" class="cover">
    <div class="phrase" id="phrase"></div>

    <button class="btn-primary" onclick="openQuestions()">
        Continuar
    </button>

    <div id="questions" class="options hidden"></div>

</div>

<!-- RESULTADO -->
<div id="result" class="screen hidden">

    <h2>Seu Temperamento</h2>
    <h1 id="type"></h1>
    <p id="text"></p>

    <button class="btn-primary" onclick="location.reload()">Refazer</button>

</div>

</div>

<script>

let i = 0;

let score = {
    colerico:0,
    sanguineo:0,
    melancolico:0,
    fleumatico:0
};

const stations = [

{
img:"img-estacao-1.jpg",
phrase:"Nem toda reação nasce no momento… algumas já vivem dentro de você.",
q:[
["Ação direta","colerico"],
["Explosão rápida","sanguineo"],
["Silêncio","fleumatico"],
["Sentimento interno","melancolico"]
]
},

{
img:"img-estacao-2.jpg",
phrase:"O que te toca, permanece ou se dissolve?",
q:[
["Esqueço rápido","sanguineo"],
["Guardo tudo","melancolico"],
["Evito conflito","fleumatico"],
["Reajo na hora","colerico"]
]
},

{
img:"img-estacao-3.jpg",
phrase:"Sua presença fala antes de você.",
q:[
["Lidero","colerico"],
["Comunico","sanguineo"],
["Observo","fleumatico"],
["Me fecho","melancolico"]
]
},

{
img:"img-estacao-4.jpg",
phrase:"Sob pressão, você se revela.",
q:[
["Enfrento","colerico"],
["Emociono","sanguineo"],
["Me afasto","fleumatico"],
["Analiso","melancolico"]
]
},

{
img:"img-estacao-5.jpg",
phrase:"Sua mente define seu caminho.",
q:[
["Decido rápido","colerico"],
["Sigo impulso","sanguineo"],
["Penso profundo","melancolico"],
["Demoro","fleumatico"],
["Analiso tudo","melancolico"]
]
}

];

function start(){
document.getElementById("start").classList.add("hidden");
document.getElementById("station").classList.remove("hidden");
load();
}

function load(){
let s = stations[i];

document.getElementById("img").src = s.img;
document.getElementById("phrase").innerText = s.phrase;

document.getElementById("questions").classList.add("hidden");
}

function openQuestions(){

let s = stations[i];

let html = "";

s.q.forEach(x=>{
html += `<div class="option" onclick="answer('${x[1]}')">${x[0]}</div>`;
});

document.getElementById("questions").innerHTML = html;
document.getElementById("questions").classList.remove("hidden");
}

function answer(t){
score[t]++;
i++;

if(i >= stations.length){
show();
return;
}

load();
}

function show(){

document.getElementById("station").classList.add("hidden");
document.getElementById("result").classList.remove("hidden");

let max = Object.keys(score).reduce((a,b)=> score[a]>score[b]?a:b);

let names = {
colerico:"Colérico 🔥",
sanguineo:"Sanguíneo 🌸",
melancolico:"Melancólico 🌙",
fleumatico:"Fleumático 🌊"
};

document.getElementById("type").innerText = names[max];

document.getElementById("text").innerText =
"Seu padrão emocional foi identificado com base na sua jornada.";

}

</script>

</body>
</html>
