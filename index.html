<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jornada dos Temperamentos</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Quicksand:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:'Quicksand', sans-serif;
    background: radial-gradient(circle at top, #ffe6ef, #fff7fb);
    color:#3a2b33;
    overflow-x:hidden;
}

/* CENTRALIZAÇÃO */
.container{
    width:100%;
    max-width:720px;
    margin:auto;
    padding:20px;
}

/* CARD PRINCIPAL */
.screen{
    margin-top:40px;
    padding:30px;
    border-radius:40px;
    background: rgba(255,255,255,0.65);
    backdrop-filter: blur(20px);
    box-shadow: 0 20px 60px rgba(255,105,140,0.15);
    border: 1px solid rgba(255, 120, 160, 0.2);
    animation: fade 0.5s ease;
}

/* TITULO */
h1,h2{
    font-family:'Playfair Display', serif;
    font-weight:500;
    text-align:center;
    letter-spacing:0.5px;
}

/* FRASE DA ESTAÇÃO */
.desc{
    text-align:center;
    opacity:0.75;
    margin-bottom:20px;
}

/* BOTÃO PRINCIPAL */
.btn-primary{
    width:100%;
    padding:15px;
    border:none;
    border-radius:999px;
    background: linear-gradient(135deg,#ff6fa5,#ff3f86);
    color:white;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.btn-primary:hover{
    transform:scale(1.03);
}

/* OPÇÕES EM CÍRCULOS */
.options{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
    margin-top:20px;
}

/* BOTÕES CIRCULARES */
.option{
    width:120px;
    height:120px;
    border-radius:50%;
    background: rgba(255,255,255,0.7);
    border:1px solid rgba(255,120,160,0.25);
    box-shadow:0 10px 25px rgba(255,150,180,0.15);

    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;

    font-size:12px;
    padding:10px;

    cursor:pointer;
    transition:0.25s;
}

.option:hover{
    transform:scale(1.08);
    background:white;
}

/* IMAGEM DA ESTAÇÃO */
.cover-image{
    width:100%;
    border-radius:30px;
    margin-bottom:20px;
    box-shadow:0 20px 40px rgba(0,0,0,0.1);
}

/* ANIMAÇÃO */
@keyframes fade{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
}

.hidden{display:none;}

</style>
</head>

<body>

<div class="container">

<!-- CAPA -->
<div id="startScreen" class="screen">
    <h1>Jornada dos Temperamentos</h1>
    <p class="desc">Uma experiência de autoconhecimento profundo e visual imersivo.</p>
    <button class="btn-primary" onclick="start()">Começar Jornada</button>
</div>

<!-- ESTAÇÃO -->
<div id="stationScreen" class="screen hidden">

    <img id="stationImage" class="cover-image">

    <h2 id="stationPhrase"></h2>

    <div class="options" id="options"></div>

</div>

<!-- RESULTADO -->
<div id="resultScreen" class="screen hidden">

    <h2>Seu Temperamento</h2>
    <h2 id="resultType"></h2>

    <button class="btn-primary" onclick="restart()">Refazer</button>
</div>

</div>

<script>

const stations = [
{img:"img1.jpg", phrase:"A origem da sua reação ao mundo",
options:[
["Responder imediatamente e me posicionar","colerico"],
["Reagir com intensidade e depois aliviar","sanguineo"],
["Ficar em silêncio observando","fleumatico"],
["Sentir por dentro sem demonstrar","melancolico"]
]},

{img:"img2.jpg", phrase:"O que fica em você depois do impacto",
options:[
["Enfrento na hora","colerico"],
["Fico chateado mas sigo","sanguineo"],
["Evito demonstrar","fleumatico"],
["Guardo por muito tempo","melancolico"]
]},

{img:"img3.jpg", phrase:"Sua presença no mundo",
options:[
["Lidero naturalmente","colerico"],
["Converso com facilidade","sanguineo"],
["Observo antes de agir","fleumatico"],
["Sou reservado","melancolico"]
]},

{img:"img4.jpg", phrase:"Sob pressão você revela quem é",
options:[
["Enfrento direto","colerico"],
["Reajo emocionalmente","sanguineo"],
["Evito conflito","fleumatico"],
["Analiso tudo","melancolico"]
]},

{img:"img5.jpg", phrase:"Sua estrutura interna",
options:[
["Decido rápido","colerico"],
["Sigo intuição","sanguineo"],
["Analiso profundamente","melancolico"],
["Demoro até ter certeza","fleumatico"]
]}
];

let index = 0;

let score = {
colerico:0,
sanguineo:0,
fleumatico:0,
melancolico:0
};

function start(){
document.getElementById("startScreen").classList.add("hidden");
document.getElementById("stationScreen").classList.remove("hidden");
load();
}

function load(){

if(index >= stations.length){
result();
return;
}

let s = stations[index];

document.getElementById("stationImage").src = s.img;
document.getElementById("stationPhrase").innerText = s.phrase;

let html = "";

s.options.forEach(o=>{
html += `<div class="option" onclick="pick('${o[1]}')">${o[0]}</div>`;
});

document.getElementById("options").innerHTML = html;
}

function pick(type){
score[type]++;
index++;
load();
}

function result(){

document.getElementById("stationScreen").classList.add("hidden");
document.getElementById("resultScreen").classList.remove("hidden");

let max = Math.max(...Object.values(score));

let winner = Object.keys(score).find(k => score[k] === max);

const names = {
colerico:"Colérico 🔥",
sanguineo:"Sanguíneo 🌬️",
fleumatico:"Fleumático 🌊",
melancolico:"Melancólico 🌍"
};

document.getElementById("resultType").innerText = names[winner];

}

function restart(){
location.reload();
}

</script>

</body>
</html>
