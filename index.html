<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jornada dos Temperamentos</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&display=swap');

body {
    margin: 0;
    font-family: 'Quicksand', sans-serif;

    /* fundo claro rosado e suave */
    background: linear-gradient(180deg, #fff6f9, #ffeef4);
    color: #3a2b33;

    display: flex;
    justify-content: center;
}

/* CONTAINER */
.container {
    width: 100%;
    max-width: 680px;
    padding: 24px;
}

/* CARTÕES */
.screen {
    background: rgba(255, 255, 255, 0.75);
    border: 1px solid rgba(255, 150, 180, 0.25);
    border-radius: 22px;
    padding: 26px;
    margin-top: 20px;
    box-shadow: 0 12px 30px rgba(255, 170, 190, 0.15);
    backdrop-filter: blur(10px);
}

/* TITULOS */
h1, h2, h3 {
    font-family: 'Playfair Display', serif;
    font-weight: 500;
    letter-spacing: 0.3px;
    color: #3b2a33;
}

/* TEXTO */
p {
    opacity: 0.75;
    line-height: 1.6;
}

/* BOTÃO PRINCIPAL (início e resultado) */
.btn-primary {
    width: 100%;
    padding: 15px;
    margin-top: 18px;

    border: none;
    border-radius: 18px;

    background: linear-gradient(135deg, #ff7aa2, #ff4f87);
    color: white;

    font-weight: 600;
    letter-spacing: 0.5px;

    cursor: pointer;

    box-shadow: 0 10px 20px rgba(255, 79, 135, 0.25);
    transition: 0.25s;
}

.btn-primary:hover {
    transform: translateY(-2px);
}

/* BOTÃO SECUNDÁRIO (Instagram) */
.btn-secondary {
    width: 100%;
    padding: 14px;
    margin-top: 12px;

    border-radius: 18px;
    border: 1px solid rgba(255, 79, 135, 0.3);

    background: transparent;
    color: #d94f7c;

    font-weight: 500;

    cursor: pointer;
    transition: 0.25s;
}

.btn-secondary:hover {
    background: rgba(255, 122, 162, 0.1);
}

/* OPÇÕES */
.option {
    background: rgba(255, 255, 255, 0.9);
    border: 1px solid rgba(255, 122, 162, 0.25);

    padding: 14px;
    margin: 10px 0;

    border-radius: 16px;

    cursor: pointer;

    transition: 0.2s;

    box-shadow: 0 6px 15px rgba(255, 200, 215, 0.12);
}

.option:hover {
    transform: scale(1.02);
    background: #fff;
    border-color: #ff7aa2;
}

/* DESCRIÇÃO */
.desc {
    opacity: 0.7;
    margin-bottom: 16px;
}

/* RESULTADO */
#resultType {
    font-size: 22px;
    color: #ff4f87;
    margin-top: 10px;
}

/* HIDE */
.hidden {
    display: none;
}

/* ANIMAÇÃO SUAVE */
.screen {
    animation: fadeIn 0.5s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* CAPA IMAGE */
.cover-image {
    width: 100%;
    border-radius: 20px;
    margin-bottom: 18px;

    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    object-fit: cover;
}
</style>
</head>

<body>

<div class="container">

<!-- CAPA -->
<div id="startScreen" class="screen">

    <img src="capa.jpg" alt="Capa da Jornada" class="cover-image">

    <h1>Jornada dos Temperamentos</h1>
    
    <p>
        Uma experiência de autoconhecimento para revelar sua natureza emocional, mental e comportamental.
    </p>

    <button class="btn-primary" onclick="start()">
        Começar Jornada
    </button>

</div>

<!-- ESTAÇÕES -->
<div id="stationScreen" class="screen hidden">

    <h2 id="stationTitle"></h2>
    <p class="desc" id="stationDesc"></p>

    <div id="questions"></div>

</div>

<!-- RESULTADO -->
<div id="resultScreen" class="screen hidden">

    <h2>Seu Resultado</h2>
    <h3 id="resultType"></h3>
    <p id="resultText"></p>

    <button class="btn-primary" onclick="restart()">Refazer Jornada</button>
    <button class="btn-secondary" onclick="window.open('https://instagram.com','_blank')">
        Instagram
    </button>

</div>

</div>

<script>

let currentStation = 0;

let scores = {
    colerico: 0,
    sanguineo: 0,
    fleumatico: 0,
    melancolico: 0
};

const stations = [

{
title: "A Origem",
desc: "Como você reage ao mundo",
questions: [
["Responder imediatamente e me posicionar", "colerico"],
["Reagir com intensidade e depois aliviar", "sanguineo"],
["Ficar em silêncio observando", "fleumatico"],
["Sentir por dentro, mas não demonstrar", "melancolico"]
]
},

{
title: "As Marcas Emocionais",
desc: "Como você sente e guarda o que vive",
questions: [
["Enfrento na hora", "colerico"],
["Fico chateado, mas sigo", "sanguineo"],
["Evito demonstrar", "fleumatico"],
["Guardo por muito tempo", "melancolico"]
]
},

{
title: "Sua Presença no Mundo",
desc: "Como você se expressa",
questions: [
["Assumo liderança naturalmente", "colerico"],
["Converso com facilidade", "sanguineo"],
["Observo antes de interagir", "fleumatico"],
["Sou mais reservado", "melancolico"]
]
},

{
title: "Sob Pressão",
desc: "Como você reage em conflitos",
questions: [
["Enfrento diretamente", "colerico"],
["Reajo emocionalmente", "sanguineo"],
["Evito conflito", "fleumatico"],
["Analiso antes de agir", "melancolico"]
]
},

{
title: "Sua Estrutura Interna",
desc: "Como sua mente funciona",
questions: [
["Decido rápido", "colerico"],
["Sigo minha intuição", "sanguineo"],
["Analiso com calma", "melancolico"],
["Demoro até ter certeza", "fleumatico"],
["Penso profundamente antes de agir", "melancolico"]
]
}

];

function start(){
document.getElementById("startScreen").classList.add("hidden");
document.getElementById("stationScreen").classList.remove("hidden");
loadStation();
}

function loadStation(){

if(currentStation >= stations.length){
showResult();
return;
}

let station = stations[currentStation];

document.getElementById("stationTitle").innerText = station.title;
document.getElementById("stationDesc").innerText = station.desc;

let html = "";

station.questions.forEach(q => {
html += `<div class="option" onclick="answer('${q[1]}')">${q[0]}</div>`;
});

document.getElementById("questions").innerHTML = html;
}

function answer(type){
scores[type]++;
currentStation++;
loadStation();
}

function showResult(){

document.getElementById("stationScreen").classList.add("hidden");
document.getElementById("resultScreen").classList.remove("hidden");

let max = Math.max(scores.colerico, scores.sanguineo, scores.fleumatico, scores.melancolico);

let candidates = Object.keys(scores).filter(t => scores[t] === max);

const priority = ["colerico","sanguineo","melancolico","fleumatico"];

let result = candidates.length === 1
? candidates[0]
: priority.find(p => candidates.includes(p));

const names = {
colerico: "Colérico 🔥 FOGO",
sanguineo: "Sanguíneo 🌬️ AR",
fleumatico: "Fleumático 🌊 ÁGUA",
melancolico: "Melancólico 🌍 TERRA"
};

const texts = {
colerico: "Você é direto, intenso e movido por ação.",
sanguineo: "Você é comunicativo, leve e espontâneo.",
fleumatico: "Você é calmo, estável e observador.",
melancolico: "Você é profundo, sensível e analítico."
};

document.getElementById("resultType").innerText = names[result];
document.getElementById("resultText").innerText = texts[result];

}

function restart(){
location.reload();
}

</script>

</body>
</html>
