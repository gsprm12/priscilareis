<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Origem da Reação</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #ffe4ec, #fff5f8);
    font-family: 'Segoe UI', sans-serif;
  }

  /* =========================
     CAPA (TELA 1)
  ========================= */
  .capa {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 30px;
    text-align: center;
  }

  .circle-image {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #ffd1dc;
    box-shadow: 0 10px 25px rgba(255, 182, 193, 0.3);
  }

  .btn {
    padding: 14px 26px;
    border-radius: 999px;
    border: 1px solid #ffd1dc;
    background: #fff;
    color: #444;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(255, 192, 203, 0.25);
    transition: transform 0.2s ease;
  }

  .btn:hover {
    transform: scale(1.05);
  }

  /* =========================
     QUIZ (TELA 2)
  ========================= */
  .container {
    width: min(900px, 92%);
    padding: 60px 40px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.75);
    box-shadow: 0 20px 60px rgba(255, 192, 203, 0.25);
    backdrop-filter: blur(10px);
    text-align: center;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 28px;
    color: #444;
    margin-bottom: 40px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 120px);
    gap: 25px;
    justify-content: center;
  }

  .circle-btn {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid #ffd1dc;
    box-shadow:
      6px 6px 15px rgba(255, 182, 193, 0.25),
      -6px -6px 15px rgba(255, 255, 255, 0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 12px;
    font-size: 12px;
    color: #555;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .circle-btn:hover {
    transform: scale(1.05);
  }

  /* esconder tela 2 no início */
  .hidden {
    display: none;
  }

  @media (max-width: 600px) {
    .container {
      border-radius: 60px;
      padding: 40px 20px;
    }

    .grid {
      grid-template-columns: repeat(2, 110px);
      gap: 18px;
    }

    .circle-btn {
      width: 110px;
      height: 110px;
      font-size: 11px;
    }

    h1 {
      font-size: 22px;
    }
  }
</style>
</head>

<body>

<!-- =========================
     TELA 1 - CAPA
========================= -->
<div id="telaCapa" class="capa">
  <img src="Capa.jpg" class="circle-image" alt="Capa" />
  <button class="btn" onclick="iniciarJornada()">
    Sua Jornada começa aqui
  </button>
</div>

<!-- =========================
     TELA 2 - QUIZ
========================= -->
<div id="telaQuiz" class="container hidden">

  <h1>A origem da sua reação ao mundo</h1>

  <div class="grid">
    <div class="circle-btn">Responder imediatamente e me posicionar</div>
    <div class="circle-btn">Reagir com intensidade e depois aliviar</div>
    <div class="circle-btn">Ficar em silêncio observando</div>
    <div class="circle-btn">Sentir por dentro sem demonstrar</div>
  </div>

</div>

<script>
  function iniciarJornada() {
    document.getElementById("telaCapa").style.display = "none";
    document.getElementById("telaQuiz").classList.remove("hidden");
  }
</script>

</body>
</html>
