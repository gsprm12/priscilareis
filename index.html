<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jornada dos Temperamentos</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

<style>

body {
    margin: 0;
    font-family: 'Quicksand', sans-serif;
    background: linear-gradient(180deg, #fff6f9, #ffeef4);
    color: #3a2b33;
    display: flex;
    justify-content: center;
}

.container {
    width: 100%;
    max-width: 680px;
    padding: 24px;
}

.screen {
    background: rgba(255, 255, 255, 0.75);
    border: 1px solid rgba(255, 150, 180, 0.25);
    border-radius: 22px;
    padding: 26px;
    margin-top: 20px;
    box-shadow: 0 12px 30px rgba(255, 170, 190, 0.15);
    backdrop-filter: blur(10px);
}

h1, h2, h3 {
    font-family: 'Playfair Display', serif;
    text-align: center;
}

.option {
    background: rgba(255,255,255,0.85);
    border: 1px solid rgba(255, 122, 162, 0.25);
    padding: 14px;
    margin: 10px 0;
    border-radius: 16px;
    cursor: pointer;
    text-align: center;
    transition: 0.2s;
}

.option:hover {
    transform: scale(1.02);
    border-color: #ff7aa2;
}

.btn-primary {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, #ff7aa2, #ff4f87);
    color: white;
    font-weight: 600;
    cursor: pointer;
}

.btn-secondary {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border-radius: 18px;
    border: 1px solid rgba(255, 79, 135, 0.3);
    background: transparent;
    color: #d94f7c;
}

.hidden { display: none; }

.cover-image {
    width: 100%;
    border-radius: 20px;
    margin-bottom: 18px;
}

</style>

</head>

<body>

<div class="container">

<!-- CAPA -->
<div id="startScreen" class="screen">
    <img src="capa.jpg" class="cover-image">

    <h1>Jornada dos Temperamentos</h1>
    <p>Uma experiência de autoconhecimento...</p>

    <button class="btn-primary" onclick="start()">Começar Jornada</button>
</div>

<!-- ESTACAO -->
<div id="stationScreen" class="screen hidden">
    <h2 id="stationTitle"></h2>
    <p id="stationDesc"></p>
    <div id="questions"></div>
</div>

<!-- RESULTADO -->
<div id="resultScreen" class="screen hidden">
    <h2>Seu Resultado</h2>
    <h3 id="resultType"></h3>
    <p id="resultText"></p>

    <button class="btn-primary" onclick="restart()">Refazer Jornada</button>

    <button class="btn-secondary" onclick="window.open('https://instagram.com','_blank')">
        Instagram
    </button>
</div>

</div>

<script>

let currentStation = 0;

let scores = {
    colerico: 0,
    sanguineo: 0,
    fleumatico: 0,
    melancolico: 0
};

const stations = [
{
title: "A Origem",
desc: "Como você reage ao mundo",
questions: [
["Responder imediatamente", "colerico"],
["Reagir e depois aliviar", "sanguineo"],
["Observar em silêncio", "fleumatico"],
["Sentir por dentro", "melancolico"]
]
},
{
title: "Emoções",
desc: "Como você guarda o que vive",
questions: [
["Enfrento na hora", "colerico"],
["Supero rápido", "sanguineo"],
["Evito demonstrar", "fleumatico"],
["Guardo tudo", "melancolico"]
]
}
];

function start(){
document.getElementById("startScreen").classList.add("hidden");
document.getElementById("stationScreen").classList.remove("hidden");
loadStation();
}

function loadStation(){

if(currentStation >= stations.length){
showResult();
return;
}

let station = stations[currentStation];

document.getElementById("stationTitle").innerText = station.title;
document.getElementById("stationDesc").innerText = station.desc;

let html = "";

station.questions.forEach(q => {
html += `<div class="option" onclick="answer('${q[1]}')">${q[0]}</div>`;
});

document.getElementById("questions").innerHTML = html;
}

function answer(type){
scores[type]++;
currentStation++;
loadStation();
}

function showResult(){

document.getElementById("stationScreen").classList.add("hidden");
document.getElementById("resultScreen").classList.remove("hidden");

let max = Math.max(...Object.values(scores));

let result = Object.keys(scores).find(k => scores[k] === max);

const names = {
colerico: "Colérico 🔥",
sanguineo: "Sanguíneo 🌬️",
fleumatico: "Fleumático 🌊",
melancolico: "Melancólico 🌍"
};

document.getElementById("resultType").innerText = names[result];

}

function restart(){
location.reload();
}

</script>

</body>
</html>
