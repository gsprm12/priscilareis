<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jornada dos Temperamentos</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

<style>

body {
    margin: 0;
    font-family: 'Quicksand', sans-serif;
    background: linear-gradient(180deg, #fff6f9, #ffeef4);
    color: #3a2b33;
    display: flex;
    justify-content: center;
}

.container {
    width: 100%;
    max-width: 680px;
    padding: 24px;
}

.screen {
    background: rgba(255, 255, 255, 0.75);
    border: 1px solid rgba(255, 150, 180, 0.25);
    border-radius: 22px;
    padding: 26px;
    margin-top: 20px;
    box-shadow: 0 12px 30px rgba(255, 170, 190, 0.15);
    backdrop-filter: blur(10px);
    animation: fadeIn 0.5s ease;
}

h1, h2, h3 {
    font-family: 'Playfair Display', serif;
    text-align: center;
}

p {
    opacity: 0.75;
    line-height: 1.6;
    text-align: center;
}

.cover-image {
    width: 100%;
    border-radius: 20px;
    margin-bottom: 18px;
    object-fit: cover;
}

.btn-primary {
    width: 100%;
    padding: 15px;
    margin-top: 18px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, #ff7aa2, #ff4f87);
    color: white;
    font-weight: 600;
    cursor: pointer;
}

.btn-secondary {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border-radius: 18px;
    border: 1px solid #ff7aa2;
    background: transparent;
    color: #d94f7c;
}

.option {
    padding: 14px;
    margin: 10px 0;
    border-radius: 16px;
    background: rgba(255,255,255,0.85);
    border: 1px solid rgba(255,122,162,0.25);
    text-align: center;
    cursor: pointer;
    transition: 0.2s;
}

.option:hover {
    transform: scale(1.02);
    background: white;
}

.hidden { display:none; }

@keyframes fadeIn {
    from {opacity:0; transform:translateY(10px);}
    to {opacity:1; transform:translateY(0);}
}

/* frase na imagem */
.station-phrase {
    text-align:center;
    font-family:'Playfair Display';
    font-size:18px;
    margin-top:-60px;
    color:white;
    text-shadow:0 3px 12px rgba(0,0,0,0.6);
}

</style>
</head>

<body>

<div class="container">

<!-- CAPA -->
<div id="startScreen" class="screen">

    <h1>Jornada dos Temperamentos</h1>
    <p>Uma experiência de autoconhecimento profundo sobre sua natureza emocional e mental.</p>

    <button class="btn-primary" onclick="start()">Começar Jornada</button>

</div>

<!-- ESTAÇÃO -->
<div id="stationScreen" class="screen hidden">

    <div id="stationIntro">

        <img id="stationImage" class="cover-image">

        <h2 id="stationPhrase" class="station-phrase"></h2>

        <button class="btn-primary" onclick="showQuestions()">
            Continuar jornada
        </button>

    </div>

    <div id="stationQuestions" class="hidden">

        <h2 id="stationTitle"></h2>
        <p id="stationDesc"></p>

        <div id="questions"></div>

    </div>

</div>

<!-- RESULTADO -->
<div id="resultScreen" class="screen hidden">

    <h2>Seu Temperamento</h2>
    <h3 id="resultType"></h3>
    <p id="resultText"></p>

    <button class="btn-primary" onclick="restart()">Refazer Jornada</button>

    <button class="btn-secondary" onclick="window.open('https://instagram.com','_blank')">
        Instagram
    </button>

</div>

</div>

<script>

let currentStation = 0;

let scores = {
    colerico: 0,
    sanguineo: 0,
    fleumatico: 0,
    melancolico: 0
};

const stations = [

{
image:"img-estacao-1.jpg",
phrase:"Nem toda reação nasce no momento… algumas já vivem dentro de você.",
title:"A Origem",
desc:"Como você reage ao mundo",
questions:[
["Responder imediatamente e me posicionar","colerico"],
["Reagir com intensidade e depois aliviar","sanguineo"],
["Ficar em silêncio observando","fleumatico"],
["Sentir por dentro, mas não demonstrar","melancolico"]
]
},

{
image:"img-estacao-2.jpg",
phrase:"O que fica em você mesmo depois do silêncio...",
title:"Marcas Emocionais",
desc:"O que você guarda",
questions:[
["Esqueço rápido","sanguineo"],
["Fico chateado, mas sigo","colerico"],
["Guardo por muito tempo","melancolico"],
["Evito demonstrar","fleumatico"]
]
},

{
image:"img-estacao-3.jpg",
phrase:"Sua presença fala antes de você...",
title:"Presença",
desc:"Como você se expressa",
questions:[
["Lidero naturalmente","colerico"],
["Sou comunicativo","sanguineo"],
["Sou observador","fleumatico"],
["Sou reservado","melancolico"]
]
},

{
image:"img-estacao-4.jpg",
phrase:"Sob pressão, sua verdade aparece...",
title:"Pressão",
desc:"Como reage ao conflito",
questions:[
["Enfrento diretamente","colerico"],
["Reajo emocionalmente","sanguineo"],
["Evito conflito","fleumatico"],
["Analiso antes de agir","melancolico"]
]
},

{
image:"img-estacao-5.jpg",
phrase:"Aqui está sua estrutura interna...",
title:"Essência",
desc:"Como você pensa",
questions:[
["Decido rápido","colerico"],
["Sigo minha intuição","sanguineo"],
["Analiso profundamente","melancolico"],
["Demoro até ter certeza","fleumatico"],
["Penso antes de tudo","melancolico"]
]
}

];

function start(){
document.getElementById("startScreen").classList.add("hidden");
document.getElementById("stationScreen").classList.remove("hidden");
loadStation();
}

function loadStation(){

if(currentStation >= stations.length){
showResult();
return;
}

let s = stations[currentStation];

document.getElementById("stationImage").src = s.image;
document.getElementById("stationPhrase").innerText = s.phrase;

document.getElementById("stationIntro").classList.remove("hidden");
document.getElementById("stationQuestions").classList.add("hidden");

window.currentData = s;
}

function showQuestions(){

let s = window.currentData;

document.getElementById("stationIntro").classList.add("hidden");
document.getElementById("stationQuestions").classList.remove("hidden");

document.getElementById("stationTitle").innerText = s.title;
document.getElementById("stationDesc").innerText = s.desc;

let html = "";

s.questions.forEach(q=>{
html += `<div class="option" onclick="answer('${q[1]}')">${q[0]}</div>`;
});

document.getElementById("questions").innerHTML = html;
}

function answer(type){
scores[type]++;
currentStation++;
loadStation();
}

function showResult(){

document.getElementById("stationScreen").classList.add("hidden");
document.getElementById("resultScreen").classList.remove("hidden");

let max = Math.max(...Object.values(scores));

let result = Object.keys(scores).find(k => scores[k] === max);

const names = {
colerico:"Colérico 🔥 FOGO",
sanguineo:"Sanguíneo 🌬️ AR",
melancolico:"Melancólico 🌍 TERRA",
fleumatico:"Fleumático 🌊 ÁGUA"
};

const texts = {
colerico:"Você é intenso, direto e movido por ação.",
sanguineo:"Você é leve, comunicativo e espontâneo.",
melancolico:"Você é profundo, analítico e sensível.",
fleumatico:"Você é calmo, observador e estável."
};

document.getElementById("resultType").innerText = names[result];
document.getElementById("resultText").innerText = texts[result];

}

function restart(){
location.reload();
}

</script>

</body>
</html>
