<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Origem da Reação</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

#telaQuiz {
  font-family: 'Poppins', sans-serif;
}

h1 {
  font-size: 28px;
  font-weight: 600;
  letter-spacing: 0.5px;
  margin-bottom: 20px;
  color: #333;
}

h2 {
  font-size: 24px;
  font-weight: 600;
  margin-bottom: 10px;
  color: #444;
  letter-spacing: 0.3px;
}

p {
  font-size: 15.5px;
  line-height: 1.7;
  color: #555;
}
 
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #ffe4ec, #fff5f8);
    font-family: 'Segoe UI', sans-serif;
  }

/* =========================
   CAPA AJUSTADA (PROFISSIONAL)
========================= */
.capa {
  width: 100%;
  height: 100vh;

  background: url("Capa.jpg") center top / contain no-repeat;
  background-color: #000; /* fundo elegante nas laterais */

  position: relative;

  display: flex;
  align-items: flex-end;
  justify-content: center;
}

/* camada escura suave só embaixo */
.overlay {
  width: 100%;
  padding: 80px 25px;

  display: flex;
  justify-content: center;
  align-items: flex-end;

  background: linear-gradient(
    to top,
    rgba(0,0,0,0.55),
    rgba(0,0,0,0)
  );
}

 .btn {
  padding: 16px 34px;
  border-radius: 999px;
  border: none;

  background: #fff;
  color: #444;

  font-size: 15px;
  font-weight: 500;

  cursor: pointer;

  box-shadow: 0 10px 25px rgba(0,0,0,0.25);

  transition: all 0.25s ease;
}

.btn:hover {
  transform: scale(1.06);
  box-shadow: 0 14px 30px rgba(0,0,0,0.35);
}
 
  /* =========================
     QUIZ (TELA 2)
  ========================= */
.container {
  width: 750px;
  height: 750px;
  padding: 60px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.75);
  box-shadow: 0 20px 60px rgba(255, 192, 203, 0.25);
  backdrop-filter: blur(10px);
  text-align: center;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

  h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 28px;
    color: #444;
    margin-bottom: 40px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 120px);
    gap: 25px;
    justify-content: center;
  }

.circle-btn {
  width: 160px;
  height: 160px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid #ffd1dc;

  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;

  padding: 18px;
  font-size: 14px;
}

 .imagem-pergunta {
  width: 100%;
  max-width: 400px;
  height: auto;
  border-radius: 0; 
  display: block;
  margin-bottom: 20px;
}

  .circle-btn:hover {
    transform: scale(1.05);
  }

  /* esconder tela 2 no início */
  .hidden {
    display: none;
  }

  @media (max-width: 600px) {
    .container {
      border-radius: 60px;
      padding: 40px 20px;
    }

    .grid {
      grid-template-columns: repeat(2, 110px);
      gap: 18px;
    }

    .circle-btn {
      width: 110px;
      height: 110px;
      font-size: 11px;
    }

    h1 {
      font-size: 22px;
    }
  }
</style>
</head>

<body>

<!-- =========================
     TELA 1 - CAPA
========================= -->
<!-- TELA 1 - CAPA FULL SCREEN -->
<div id="telaCapa" class="capa">

  <div class="overlay">

    <button class="btn" onclick="iniciarJornada()">
      Sua Jornada Começa Aqui
    </button>

  </div>

</div>

<!-- =========================
     TELA 2 - QUIZ
========================= -->
<div id="telaQuiz" class="container hidden">

  <div id="progresso" style="margin-bottom:15px;color:#888;font-size:14px;">
  Estação 1 de 7
</div>

  <img id="imagemPergunta" class="imagem-pergunta">
 
<p id="textoPergunta"
   style="max-width:400px;margin-bottom:25px;color:#666;font-size:14px;">
</p>

<div class="grid">
  <div class="circle-btn" id="opcao0"></div>
  <div class="circle-btn" id="opcao1"></div>
  <div class="circle-btn" id="opcao2"></div>
  <div class="circle-btn" id="opcao3"></div>
</div>

</div>
 
  <script>

const perguntas = [
{
imagem:"estacao1.jpg",
titulo:"— A Origem",
texto:"Você não teve tempo de pensar. Alguém entra, fala algo, muda o clima do ambiente. O que nasce em você primeiro?",
opcoes:[
{texto:"Eu me posiciono rapidamente e sinto necessidade de agir ou responder.",tipo:"colerico"},
{texto:"Reajo de forma espontânea, expressando o que sinto no momento.",tipo:"sanguineo"},
{texto:"Observo primeiro e procuro entender antes de agir.",tipo:"fleumatico"},
{texto:"Percebo tudo internamente e começo a processar o que aconteceu.",tipo:"melancolico"}
]
},

{
imagem:"estacao2.jpg",
titulo:"As Marcas Que Permanecem",
texto:"Algo te marcou. Isso costuma ficar em você como:",
opcoes:[
{texto:"Fortalece minhas convicções.",tipo:"colerico"},
{texto:"Sinto forte e depois passa.",tipo:"sanguineo"},
{texto:"Aceito com tranquilidade.",tipo:"fleumatico"},
{texto:"Guardo profundamente.",tipo:"melancolico"}
]
},

{
imagem:"estacao3.jpg",
titulo:"O Espelho Interior",
texto:"Se você pudesse se observar de fora...",
opcoes:[
{texto:"Intenso e determinado.",tipo:"colerico"},
{texto:"Alegre e espontâneo.",tipo:"sanguineo"},
{texto:"Calmo e equilibrado.",tipo:"fleumatico"},
{texto:"Reflexivo e sensível.",tipo:"melancolico"}
]
},

{
imagem:"estacao4.jpg",
titulo:"Sua Presença no Mundo",
texto:"Quando entra em um ambiente novo...",
opcoes:[
{texto:"Assume espaço naturalmente.",tipo:"colerico"},
{texto:"Conecta-se facilmente.",tipo:"sanguineo"},
{texto:"Observa primeiro.",tipo:"fleumatico"},
{texto:"Analisa o contexto.",tipo:"melancolico"}
]
},

{
imagem:"estacao5.jpg",
titulo:"Quando o Mundo Contraria Você",
texto:"Quando alguém te desafia...",
opcoes:[
{texto:"Defendo meu ponto de vista.",tipo:"colerico"},
{texto:"Reajo e depois sigo.",tipo:"sanguineo"},
{texto:"Penso antes de responder.",tipo:"fleumatico"},
{texto:"Analiso profundamente.",tipo:"melancolico"}
]
},

{
imagem:"estacao6.jpg",
titulo:"O Funcionamento da Sua Mente",
texto:"Por dentro sua mente parece mais com:",
opcoes:[
{texto:"Foco em objetivos.",tipo:"colerico"},
{texto:"Muitas ideias ao mesmo tempo.",tipo:"sanguineo"},
{texto:"Pensamentos tranquilos.",tipo:"fleumatico"},
{texto:"Reflexões profundas.",tipo:"melancolico"}
]
},

{
imagem:"estacao7.jpg",
titulo:"Seus Talentos Naturais",
texto:"O que nasce fácil em você?",
opcoes:[
{texto:"Liderar e decidir.",tipo:"colerico"},
{texto:"Comunicar e inspirar.",tipo:"sanguineo"},
{texto:"Acolher e estabilizar.",tipo:"fleumatico"},
{texto:"Analisar e compreender.",tipo:"melancolico"}
]
}
];

let perguntaAtual = 0;
let respostaEstacao1 = null;

const pontos = {
colerico:0,
sanguineo:0,
fleumatico:0,
melancolico:0
};

function iniciarJornada(){
document.getElementById("telaCapa").style.display="none";
document.getElementById("telaQuiz").classList.remove("hidden");
mostrarPergunta();
}

function mostrarPergunta(){

const pergunta = perguntas[perguntaAtual];

document.getElementById("imagemPergunta").src =
pergunta.imagem;

document.getElementById("textoPergunta").innerText =
pergunta.texto;

document.getElementById("progresso").innerText =
`Estação ${perguntaAtual+1} de ${perguntas.length}`;

for(let i=0;i<4;i++){

const botao = document.getElementById(`opcao${i}`);

botao.innerText = pergunta.opcoes[i].texto;

botao.onclick = () => responder(pergunta.opcoes[i].tipo);
}
}

function responder(tipo){

pontos[tipo]++;

if(perguntaAtual === 0){
respostaEstacao1 = tipo;
}

perguntaAtual++;

if(perguntaAtual < perguntas.length){
mostrarPergunta();
}else{
mostrarResultado();
}
}

function mostrarResultado(){

let maior = Math.max(...Object.values(pontos));

let vencedores = Object.keys(pontos)
.filter(k => pontos[k] === maior);

let resultado;

if(vencedores.length === 1){
resultado = vencedores[0];
}else{
resultado = respostaEstacao1;
}

const textos = {

colerico: `
<h2>Colérico</h2>

<p>
Você possui uma tendência natural para agir, liderar e mover as coisas à sua volta.
Quando algo precisa acontecer, sua inclinação é assumir responsabilidade e buscar soluções.
</p>

<p>
Sua presença transmite força, determinação e coragem. Você costuma enxergar desafios como oportunidades de crescimento e dificilmente permanece indiferente diante do que considera importante.
</p>

<p>
Seu maior talento está na capacidade de transformar ideias em ação.
</p>

<p>
Seu desafio é lembrar que nem tudo precisa ser resolvido imediatamente. Às vezes, ouvir e desacelerar também faz parte da sabedoria.
</p>

<p><strong>Elemento:</strong> Fogo</p>
`,

sanguineo: `
<h2>Sanguíneo</h2>

<p>
Você possui uma energia naturalmente expansiva e comunicativa.
Seu modo de estar no mundo acontece através das conexões, das experiências e da troca com as pessoas.
</p>

<p>
Você se entusiasma facilmente, cria vínculos com naturalidade e costuma levar leveza aos ambientes por onde passa.
</p>

<p>
Seu maior talento está em inspirar, acolher e aproximar pessoas.
</p>

<p>
Seu desafio é desenvolver constância, profundidade e continuidade nos projetos que inicia.
</p>

<p><strong>Elemento:</strong> Ar</p>
`,

fleumatico: `
<h2>Fleumático</h2>

<p>
Você possui uma natureza tranquila, equilibrada e observadora.
Sua tendência é compreender antes de reagir e buscar harmonia antes do confronto.
</p>

<p>
As pessoas costumam encontrar em você estabilidade, escuta e segurança emocional.
</p>

<p>
Seu maior talento está na capacidade de acolher, pacificar e enxergar com serenidade aquilo que os outros não conseguem ver.
</p>

<p>
Seu desafio é não permitir que a acomodação ou a procrastinação roubem oportunidades importantes da sua vida.
</p>

<p><strong>Elemento:</strong> Água</p>
`,

melancolico: `
<h2>Melancólico</h2>

<p>
Você possui uma percepção profunda da realidade.
As experiências deixam marcas significativas em você e raramente passam despercebidas.
</p>

<p>
Sua mente busca significado, coerência e profundidade. Você observa detalhes que muitas pessoas não percebem.
</p>

<p>
Seu maior talento está na reflexão, na sensibilidade e na capacidade de compreender camadas mais profundas da vida.
</p>

<p>
Seu desafio é não ficar preso aos excessos da análise, da autocrítica ou das preocupações com aquilo que ainda não aconteceu.
</p>

<p><strong>Elemento:</strong> Terra</p>
`

};

document.getElementById("telaQuiz").innerHTML = `
<div style="max-width:500px; text-align:center; color:#444;">

  <h1>Sua Jornada Revelou...</h1>

  ${textos[resultado]}

  <div style="
      margin-top:30px;
      display:flex;
      flex-direction:column;
      gap:15px;
      align-items:center;
  ">

  <div style="margin-top:25px;">
  <img src="final.png" 
       alt="Jornada" 
       style="width:100%; max-width:320px; border-radius:16px; opacity:0.95;">
</div>

    <button onclick="location.reload()"
      style="
      padding:14px 28px;
      border:none;
      border-radius:999px;
      background:#fff;
      border:2px solid #ffd1dc;
      color:#444;
      cursor:pointer;
      font-size:15px;
      box-shadow:0 8px 20px rgba(255,192,203,.25);
    ">
       Refazer o Teste
    </button>

 <a
  href="https://www.instagram.com/priscilareis.analista/"
  target="_blank"
  style="
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  text-decoration:none;
  padding:14px 28px;
  border-radius:999px;
  background:#ffd1dc;
  color:#444;
  font-size:15px;
  box-shadow:0 8px 20px rgba(255,192,203,.25);
">
  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
    <path d="M7.75 2h8.5A5.75 5.75 0 0 1 22 7.75v8.5A5.75 5.75 0 0 1 16.25 22h-8.5A5.75 5.75 0 0 1 2 16.25v-8.5A5.75 5.75 0 0 1 7.75 2zm0 1.5A4.25 4.25 0 0 0 3.5 7.75v8.5A4.25 4.25 0 0 0 7.75 20.5h8.5a4.25 4.25 0 0 0 4.25-4.25v-8.5A4.25 4.25 0 0 0 16.25 3.5h-8.5z"/>
    <path d="M12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 1.5A3.5 3.5 0 1 0 12 16a3.5 3.5 0 0 0 0-7.5z"/>
    <circle cx="17.2" cy="6.8" r="1"/>
  </svg>
  Continuar Minha Jornada
</a>

  </div>

</div>
`;
} 
   
</script>

</body>
</html>
